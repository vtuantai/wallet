<div class="dialog-overlay">
    <div class="dialog-box">
        <h2>Add password</h2>
        <form>
            <div class="form-group">
                <label for="weburi_appname">Website URI or app name<a>*</a></label>
                <input id="weburi_appname" 
                    autocomplete="off" 
                    [(ngModel)]="weburi_appname" 
                    [ngModelOptions]="{standalone: true}"
                    required
                >
            </div>
            <div class="form-group">
                <label for="username">Username<a>*</a></label>
                <input id="username" 
                    autocomplete="off" 
                    [(ngModel)]="username" 
                    [ngModelOptions]="{standalone: true}"
                    required
                    maxlength="30"
                    minlength="2"
                />
            </div>
            <div class="form-group">
                <label for="password">Password<a>*</a></label>
                <div class="password-wrapper">
                    <input id="password" 
                        autocomplete="new-password" 
                        [(ngModel)]="password" 
                        [ngModelOptions]="{standalone: true}" 
                        [type]="showPassword ? 'text' : 'password'"
                        maxlength="20"
                        minlength="6"
                        required
                    />
                    <span class="toggle-password" (click)="togglePassword()">
                        <i class="fa-regular fa-eye-slash"
                        [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"
                        >
                        </i>
                    </span>
                </div>
            </div>
            <div class="form-group">
                <label for="note">Note</label>
                <textarea id="note" 
                    autocomplete="off" 
                    [(ngModel)]="note" 
                    [ngModelOptions]="{standalone: true}" 
                    type="note"
                ></textarea>
            </div>
            <div class="dialog-actions">
                <button type="button" 
                    class="cancel-btn" 
                    (click)="close()"
                >
                    Cancel
                </button>
                <button type="button" 
                class="save-btn" 
                (click)="save()"
                [disabled]="!username || !password || !weburi_appname"
                >
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
